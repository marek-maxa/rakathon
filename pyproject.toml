[project]
name = "rakathon-workspace"
version = "0.1.0"
description = "Rakathon 2026: shared Python/ML environment and provider-neutral agent workflow"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
