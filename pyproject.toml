[project]
name = "meddi-onco"
version = "0.1.0"
description = "Oncology patient monitoring with conversational intake and explainable triage"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.2.0 ; sys_platform != 'win32'",
    "plotly>=6.3.0",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
