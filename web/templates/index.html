<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MEDDI ONCO</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="chat">
      <h1>MEDDI ONCO</h1>
      <div class="messages" role="log" aria-label="Konverzace" aria-live="polite">
        <p class="message message-assistant">Jak se dnes cítíte?</p>
      </div>
      <form class="chat-form">
        <label for="message">Vaše zpráva</label>
        <textarea id="message" name="message" placeholder="Napište, co vás trápí…" required></textarea>
        <button type="submit">Next <span aria-hidden="true">→</span></button>
      </form>
    </main>
    <script src="{{ url_for('static', filename='chat.js') }}" defer></script>
  </body>
</html>
