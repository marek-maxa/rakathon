<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications · MEDDI ONCO</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="card">
      <p class="brand">MEDDI ONCO</p>
      <h1>Send a notification</h1>
      <p class="description">Enter an email address to receive a test notification.</p>
      {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
      {% for message in get_flashed_messages() %}
        <p class="notice success" role="status">{{ message }}</p>
      {% endfor %}
      <form action="{{ url_for('send_mail') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ session.get('csrf_token', '') }}">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" maxlength="254" value="{{ email or '' }}" required>
        <button type="submit">Send notification <span aria-hidden="true">→</span></button>
      </form>
    </main>
    <script>
      document.querySelector('form').addEventListener('submit', (event) => {
        const button = event.target.querySelector('button');
        button.disabled = true;
        button.textContent = 'Sending…';
      });
      window.addEventListener('pageshow', () => {
        const button = document.querySelector('button');
        button.disabled = false;
        button.textContent = 'Send notification →';
      });
    </script>
  </body>
</html>
